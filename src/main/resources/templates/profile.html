<!DOCTYPE html>
<!-- 个人主页：展示用户信息、订单管理、收藏管理 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - E购商城</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        .profile-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px 0; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 48px; color: #667eea; margin: 0 auto; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .stat-number { font-size: 32px; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 5px; }
        .order-item, .favorite-item { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .order-status { padding: 4px 12px; border-radius: 4px; font-size: 12px; }
        .status-0 { background: #fff3cd; color: #856404; }
        .status-1 { background: #d1ecf1; color: #0c5460; }
        .status-2 { background: #d4edda; color: #155724; }
        .nav-tabs .nav-link.active { background: #667eea; color: white; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/index">E购商城</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/index">首页</a></li>
                    <li class="nav-item" th:if="${user.role == 0}">
                        <a class="nav-link" href="/cart">购物车</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/profile" th:text="'欢迎，' + ${user.name}"></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">注销</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 个人主页头部 -->
    <div class="profile-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-2 text-center">
                    <div class="avatar" th:text="${user.name.substring(0,1)}">用</div>
                </div>
                <div class="col-md-10">
                    <h2 th:text="${user.name}">用户名</h2>
                    <p class="mb-1">账号：<span th:text="${user.account}">account</span></p>
                    <p class="mb-1">手机：<span th:text="${user.phone}">phone</span></p>
                    <p class="mb-0">注册时间：<span th:text="${#dates.format(user.createtime, 'yyyy-MM-dd')}">date</span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" th:text="${orderCount}">0</div>
                    <div class="stat-label">我的订单</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" th:text="${favoriteCount}">0</div>
                    <div class="stat-label">我的收藏</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-number" th:text="${user.onlineyes == 1} ? '在线' : '离线'">状态</div>
                    <div class="stat-label">当前状态</div>
                </div>
            </div>
        </div>

        <!-- Tab切换 -->
        <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
                <a class="nav-link active" data-toggle="tab" href="#orders">我的订单</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#favorites">我的收藏</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" data-toggle="tab" href="#settings">账号设置</a>
            </li>
        </ul>

        <div class="tab-content">
            <!-- 订单列表 -->
            <div class="tab-pane fade show active" id="orders">
                <div th:if="${orders.size() == 0}" class="text-center text-muted py-5">
                    <p>暂无订单</p>
                </div>
                <div th:each="order : ${orders}" class="order-item">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <strong th:text="'订单号：' + ${order.orderno}">订单号</strong>
                        </div>
                        <div class="col-md-3">
                            <span class="text-danger font-weight-bold" th:text="'￥' + ${order.totalprice}">金额</span>
                        </div>
                        <div class="col-md-3">
                            <span class="order-status" 
                                  th:classappend="'status-' + ${order.ostatus}"
                                  th:text="${order.ostatus == 0} ? '待发货' : (${order.ostatus == 1} ? '已发货' : '已完成')">状态</span>
                        </div>
                        <div class="col-md-3 text-right text-muted">
                            <small th:text="${#dates.format(order.createtime, 'yyyy-MM-dd HH:mm')}">时间</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 收藏列表 -->
            <div class="tab-pane fade" id="favorites">
                <div th:if="${favorites.size() == 0}" class="text-center text-muted py-5">
                    <p>暂无收藏</p>
                </div>
                <div class="row">
                    <div class="col-md-3" th:each="fav : ${favorites}">
                        <div class="favorite-item">
                            <img th:if="${fav.ipath != null}" th:src="${fav.ipath}" style="width:100%; height:150px; object-fit:cover; border-radius:4px;" alt="商品图片">
                            <h6 class="mt-2" th:text="${fav.cname}">商品名称</h6>
                            <p class="text-danger mb-1">￥<span th:text="${fav.cprice}">0.00</span></p>
                            <a th:href="@{/product/{id}(id=${fav.commodityid})}" class="btn btn-sm btn-primary btn-block">查看详情</a>
                            <button class="btn btn-sm btn-outline-danger btn-block mt-1" 
                                    th:onclick="'cancelFavorite(' + ${fav.commodityid} + ')'">取消收藏</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 账号设置 -->
            <div class="tab-pane fade" id="settings">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">修改个人信息</h5>
                        <form id="profileForm">
                            <div class="form-group">
                                <label>姓名</label>
                                <input type="text" class="form-control" id="profileName" th:value="${user.name}" required>
                            </div>
                            <div class="form-group">
                                <label>性别</label>
                                <select class="form-control" id="profileSex">
                                    <option value="男" th:selected="${user.sex == '男'}">男</option>
                                    <option value="女" th:selected="${user.sex == '女'}">女</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>手机号</label>
                                <input type="text" class="form-control" id="profilePhone" th:value="${user.phone}">
                            </div>
                            <button type="submit" class="btn btn-primary">保存修改</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/jquery-3.6.0.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script>
        // 取消收藏
        function cancelFavorite(commodityid) {
            if (confirm('确定取消收藏吗？')) {
                $.post('/toggleFavorite', { commodityid: commodityid }, function(res) {
                    if (res.code === 200) {
                        alert(res.data.msg);
                        location.reload();
                    } else {
                        alert(res.msg);
                    }
                });
            }
        }

        // 修改个人信息
        $('#profileForm').submit(function(e) {
            e.preventDefault();
            var name = $('#profileName').val();
            var sex = $('#profileSex').val();
            var phone = $('#profilePhone').val();
            $.post('/updateProfile', { name: name, sex: sex, phone: phone }, function(res) {
                if (res.code === 200) {
                    alert(res.msg);
                    location.reload();
                } else {
                    alert(res.msg);
                }
            });
        });
    </script>
</body>
</html>

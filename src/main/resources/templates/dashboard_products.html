<!DOCTYPE html>
<!-- 商家商品明细页：展示所有在售/停售商品的详细信息 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品明细 - E购商城商家中心</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body { background: #f0f2f5; }
        .navbar-brand { font-weight: bold; color: #e74c3c !important; font-size: 24px; }
        .page-header { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); color: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
        .detail-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .product-table th { background: #34495e; color: white; }
        .product-table img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
        .back-link { color: white; text-decoration: underline; }
        .back-link:hover { color: #f39c12; }
        .status-on { color: #27ae60; font-weight: bold; }
        .status-off { color: #e74c3c; font-weight: bold; }
        .low-stock { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">E购商城 - 商家中心</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">仪表盘</a></li>
                    <li class="nav-item"><a class="nav-link" href="/com">商品管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/board">买家留言</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link" style="color:#27ae60;font-weight:bold;" th:text="'欢迎，' + ${supplier.sname}"></span>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/logout">注销</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4" style="max-width: 1400px; margin: 0 auto; padding: 0 30px;">
        <!-- 页面头部 -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2 class="mb-1">商品明细</h2>
                <p class="mb-0" th:text="'商家：' + ${supplier.sname} + ' | 共 ' + ${commodities.size()} + ' 件商品'">商家名称</p>
            </div>
            <a href="/dashboard" class="back-link">← 返回仪表盘</a>
        </div>

        <!-- 商品明细表格 -->
        <div class="detail-card">
            <div th:if="${commodities.size() == 0}" class="text-center text-muted py-5">
                <h4>暂无商品</h4>
            </div>

            <table class="table table-bordered table-hover product-table" th:if="${commodities.size() > 0}">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>商品图片</th>
                        <th>商品名称</th>
                        <th>分类</th>
                        <th>价格</th>
                        <th>库存</th>
                        <th>状态</th>
                        <th>创建时间</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="com, iterStat : ${commodities}">
                        <td th:text="${iterStat.index + 1}">1</td>
                        <td>
                            <img th:if="${com.ipath != null}" th:src="${com.ipath}" alt="商品图片">
                            <span th:if="${com.ipath == null}">无图</span>
                        </td>
                        <td th:text="${com.cname}">商品名称</td>
                        <td th:text="${com.categoryName}">分类</td>
                        <td class="text-danger font-weight-bold" th:text="'￥' + ${com.cprice}">价格</td>
                        <td th:class="${com.cnum < 50} ? 'low-stock'" th:text="${com.cnum}">库存</td>
                        <td>
                            <span th:if="${com.cstatus == 1}" class="status-on">在售</span>
                            <span th:if="${com.cstatus == 0}" class="status-off">停售</span>
                        </td>
                        <td th:text="${#dates.format(com.createtime, 'yyyy-MM-dd')}">时间</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr style="background:#f8f9fa; font-weight:bold;">
                        <td colspan="4" class="text-right">合计：</td>
                        <td class="text-danger" th:text="'￥' + ${totalPrice}">总价值</td>
                        <td th:text="${totalStock}">总库存</td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script src="/js/jquery-3.6.0.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- 商家仪表盘：展示营业额、销量、订单数、最近售出商品等 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家中心 - E购商城</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body { background: #f0f2f5; }
        .navbar-brand { font-weight: bold; color: #e74c3c !important; font-size: 24px; }
        .stat-card { background: white; border-radius: 12px; padding: 30px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.3s; cursor: pointer; text-decoration: none; display: block; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .stat-icon { font-size: 48px; margin-bottom: 10px; }
        .stat-value { font-size: 36px; font-weight: bold; color: #333; }
        .stat-label { color: #888; font-size: 14px; margin-top: 5px; }
        .sales-color { color: #e74c3c; }
        .order-color { color: #3498db; }
        .product-color { color: #27ae60; }
        .volume-color { color: #f39c12; }
        .section-title { font-size: 20px; font-weight: bold; margin: 30px 0 20px; color: #333; }
        .sale-item { background: white; border-radius: 8px; padding: 15px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .sale-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
        .product-table th { background: #34495e; color: white; }
        .welcome-banner { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 12px; padding: 40px; margin-bottom: 30px; }
        .welcome-banner h2 { margin: 0; }
        .welcome-banner p { opacity: 0.9; margin-top: 10px; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">E购商城 - 商家中心</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item active"><a class="nav-link" href="/dashboard">仪表盘</a></li>
                    <li class="nav-item"><a class="nav-link" href="/com">商品管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/board">买家留言</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/profile" style="color:#27ae60;font-weight:bold;" th:text="'欢迎，' + ${supplier.sname}"></a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/logout">注销</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4" style="max-width: 1400px; margin: 0 auto; padding: 0 30px;">
        <!-- 欢迎横幅 -->
        <div class="welcome-banner">
            <h2 th:text="'欢迎回来，' + ${supplier.sname}">欢迎回来</h2>
            <p th:text="'今天是 ' + ${#dates.format(#dates.createNow(), 'yyyy年MM月dd日')}">日期</p>
        </div>

        <!-- 统计卡片（可点击查看详情） -->
        <div class="row">
            <div class="col-md-3">
                <a href="/dashboard/orders" class="stat-card">
                    <div class="stat-icon sales-color">￥</div>
                    <div class="stat-value sales-color" th:text="'￥' + ${totalSales}">￥0</div>
                    <div class="stat-label">总营业额 · 点击查看详情 →</div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="/dashboard/orders" class="stat-card">
                    <div class="stat-icon order-color">📦</div>
                    <div class="stat-value order-color" th:text="${orderCount}">0</div>
                    <div class="stat-label">总订单数 · 点击查看详情 →</div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="/dashboard/sales" class="stat-card">
                    <div class="stat-icon volume-color">🛒</div>
                    <div class="stat-value volume-color" th:text="${totalSalesNum}">0</div>
                    <div class="stat-label">总销量（件）· 点击查看详情 →</div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="/dashboard/products" class="stat-card">
                    <div class="stat-icon product-color"></div>
                    <div class="stat-value product-color" th:text="${productCount}">0</div>
                    <div class="stat-label">在售商品数 · 点击查看详情 →</div>
                </a>
            </div>
        </div>

        <div class="row mt-4">
            <!-- 最近售出 -->
            <div class="col-md-7">
                <h4 class="section-title">最近售出</h4>
                <div th:if="${recentSales.size() == 0}" class="text-center text-muted py-5" style="background:white; border-radius:8px;">
                    <p>暂无售出记录</p>
                </div>
                <div th:each="sale : ${recentSales}" class="sale-item">
                    <div class="row align-items-center">
                        <div class="col-md-1">
                            <img th:if="${sale.imagePath != null}" th:src="${sale.imagePath}" alt="商品图片">
                        </div>
                        <div class="col-md-4">
                            <strong th:text="${sale.commodityName}">商品名称</strong>
                        </div>
                        <div class="col-md-2">
                            <span class="text-danger" th:text="'￥' + ${sale.commodityPrice}">价格</span>
                        </div>
                        <div class="col-md-2">
                            <span th:text="'x' + ${sale.cnum}">数量</span>
                        </div>
                        <div class="col-md-2">
                            <span class="text-danger font-weight-bold" th:text="'￥' + ${sale.commodityPrice * sale.cnum}">小计</span>
                        </div>
                        <div class="col-md-1 text-right text-muted">
                            <small th:text="${#dates.format(sale.createtime, 'MM-dd HH:mm')}">时间</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 商品概况 -->
            <div class="col-md-5">
                <h4 class="section-title">商品概况</h4>
                <div style="background:white; border-radius:8px; padding:20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
                    <table class="table table-sm">
                        <thead>
                            <tr><th>商品名称</th><th>价格</th><th>库存</th><th>状态</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="com : ${commodities}">
                                <td th:text="${com.cname}">名称</td>
                                <td th:text="'￥' + ${com.cprice}">价格</td>
                                <td th:text="${com.cnum}">库存</td>
                                <td>
                                    <span th:if="${com.cstatus == 1}" class="badge badge-success">在售</span>
                                    <span th:if="${com.cstatus == 0}" class="badge badge-secondary">停售</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <p th:if="${commodities.size() == 0}" class="text-muted text-center">暂无商品</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/jquery-3.6.0.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<!-- 商家销量明细页：按商品维度展示销量统计 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销量明细 - E购商城商家中心</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        body { background: #f0f2f5; }
        .navbar-brand { font-weight: bold; color: #e74c3c !important; font-size: 24px; }
        .page-header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; }
        .detail-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .sales-table th { background: #34495e; color: white; }
        .sales-table img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .back-link { color: white; text-decoration: underline; }
        .back-link:hover { color: #f39c12; }
        .summary-row { background: #f8f9fa; font-weight: bold; }
        .bar-container { background: #e9ecef; border-radius: 4px; height: 20px; position: relative; }
        .bar-fill { background: linear-gradient(90deg, #f093fb, #f5576c); height: 100%; border-radius: 4px; transition: width 0.5s; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">E购商城 - 商家中心</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">仪表盘</a></li>
                    <li class="nav-item"><a class="nav-link" href="/com">商品管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/board">买家留言</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link" style="color:#27ae60;font-weight:bold;" th:text="'欢迎，' + ${supplier.sname}"></span>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/logout">注销</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4" style="max-width: 1400px; margin: 0 auto; padding: 0 30px;">
        <!-- 页面头部 -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h2 class="mb-1">销量明细</h2>
                <p class="mb-0" th:text="'商家：' + ${supplier.sname}">商家名称</p>
            </div>
            <a href="/dashboard" class="back-link">← 返回仪表盘</a>
        </div>

        <!-- 销量明细表格 -->
        <div class="detail-card">
            <div th:if="${allSales.size() == 0}" class="text-center text-muted py-5">
                <h4>暂无销量记录</h4>
            </div>

            <table class="table table-bordered table-hover sales-table" th:if="${allSales.size() > 0}">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>商品图片</th>
                        <th>商品名称</th>
                        <th>单价</th>
                        <th>销量（件）</th>
                        <th>销售额</th>
                        <th>销量占比</th>
                        <th>售出时间</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sale, iterStat : ${allSales}">
                        <td th:text="${iterStat.index + 1}">1</td>
                        <td>
                            <img th:if="${sale.imagePath != null}" th:src="${sale.imagePath}" alt="商品图片">
                            <span th:if="${sale.imagePath == null}">无图</span>
                        </td>
                        <td th:text="${sale.commodityName}">商品名称</td>
                        <td class="text-danger" th:text="'￥' + ${sale.commodityPrice}">单价</td>
                        <td th:text="${sale.cnum}">数量</td>
                        <td class="text-danger font-weight-bold" th:text="'￥' + ${sale.commodityPrice * sale.cnum}">小计</td>
                        <td style="min-width: 150px;">
                            <div class="bar-container">
                                <div class="bar-fill" th:style="'width: ' + ${totalQty > 0 ? sale.cnum * 100 / totalQty : 0} + '%'"></div>
                            </div>
                        </td>
                        <td th:text="${#dates.format(sale.createtime, 'yyyy-MM-dd HH:mm')}">时间</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="summary-row">
                        <td colspan="4" class="text-right">合计：</td>
                        <td th:text="${totalQty}">总销量</td>
                        <td class="text-danger font-weight-bold" th:text="'￥' + ${totalAmount}">总金额</td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <script src="/js/jquery-3.6.0.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
</body>
</html>
